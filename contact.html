<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0 ; 
            padding:0 
        }

        .photo{
            padding: 30px;
        }


        h2, h3 {
            color: #333;
        }

        form {
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .form-control, .form-select, textarea {
            margin-bottom: 15px;
        }

       
    </style>

</head>
<body>

<header>
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">

    <div class="container">
      <a class="navbar-brand" href="index.html">Guide Maroc</a>
        <button class="navbar-toggler" type="button"   data-bs-toggle="collapse"  data-bs-target="#mainNavbar"></button>
    </div>

    <div class="collapse navbar-collapse" id="mainNavbar">

        <ul class="navbar-nav ms-auto">

            <li class="nav-item"> <a class="nav-link " href="index.html">Accueil</a> </li>

            <li class="nav-item"> <a class="nav-link " href="activites.html">Activités</a> </li>

            <li class="nav-item"> <a class="nav-link " href="services.html">Services</a> </li>

            <li class="nav-item"> <a class="nav-link " href="galerie.html">Guides</a> </li>

            <li class="nav-item"> <a  class="nav-link  active def" href="contact.html">Contact</a> </li>

        </ul>

      </div>
  </nav>

</header>
<main>

<div class="photo">
    <div class="container mt-5 mb-5">
        <div class="row">
            <div class="col-12 col-md-6">
                <form>

                    <div class="mb-1 row ">
                        <label  class="col-4 col-form-label"  for="name">Nom:</label>
                    <div class="col-8">
                        <input class="form-control"  type="text" id="name" name="name" placeholder="Entrez le nom" required>
                    </div>
                    </div>
        
                    <div class="mb-1 row">
                        <label  class="col-4 col-form-label"  for="email">Email:</label><br>
                    <div class="col-8">
                        <input class="form-control"  type="email" id="email" name="email" placeholder="Entrez l'email" required>
                    </div>
                    </div>

                    <div class="mb-1 row">
                        <label  class="col-4 col-form-label"  for="ville">Entrez la ville:</label><br>
                    <div class="col-8">
                        <input class="form-control"  type="text" id="ville" name="ville" placeholder="Entrez la ville" required>
                    </div>
                    </div>

                    <div class="mb-1 row">
                        <label  class="col-4 col-form-label"  for="personne" placeholder="Entrez le nombre de personnes">Nombre de personnes:</label>
                    <div class="col-8">

                        <select class="form-select">
                            <option>2</option>
                            <option>3</option>
                            <option>4</option>
                            <option>5</option>
                            <option>6</option>
                        </select>

                    </div>
                    </div>

                    <div class="mb-1 row">
                        <label for="Service" class="col-4 col-form-label">Choisissez votre service:</label>
                    <div class="col-8">
                        <input class="form-control" list="services" name="Service" id="Service" placeholder="Choisissez votre service">
                            <datalist id="services">
                                <option value="Visite guidée en ville">
                                <option value="Excursion nature / montagne">
                                <option value="Aventure désert">
                                <option value="Excursion plage">
                                <option value="Découverte culturelle / historique">
                                <option value="Circuit gastronomique">
                            </datalist>
                    </div>
                    </div>

                    <div class="mb-1 row">
                        <label  class="col-4 col-form-label"  for="date">Date de la visite:</label><br>
                    <div class="col-8">
                        <input class="form-control"  type="date" id="date" name="date" required>
                    </div>
                    </div>

                    <div class="mb-1 row">
                        <label  class="col-4 col-form-label"  for="message">Message:</label><br>
                    <div class="col-8">
                        <textarea class="form-control"  id="message" name="message" rows="4" cols="50" placeholder="Entrez votre message" ></textarea>
                    </div>
                    </div>

                    <div class="d-flex justify-content-center gap-2 mt-">
                        <input class="btn btn-success"  type="submit" value="Envoyer"><br>
                    </div>

                    <div class="d-flex justify-content-center gap-2 mt-2">
                        <input class="btn btn-secondary"  type="reset" value="Annuler"><br>
                    </div>
                </form>
            </div>
        

        <div class="col-12 col-md-6 mt-4 mt-md-0">
                <form>
                    <h3>Nos coordonnées :</h3>

                    <input class="form-control" mb-3  value="Adresse : 123 Rue Casablanca ,Maroc " readonly>
                    <input class="form-control" mb-3  value="Téléphone : +212 600 000 000 " readonly>
                    <input class="form-control" mb-3  value="Email : guidemaroc@gmail.com" readonly>
                    <input class="form-control" mb-3  value="Heures d'ouverture : Lundi - Vendredi: 9h00 - 18h00" readonly>
                    <input class="form-control" mb-3  value="Samedi: 10h00 - 14h00" readonly>
                </form>
            </div>
        </div>
    </div>
</div>

</main>

</body>
</html>
